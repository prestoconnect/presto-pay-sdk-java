server:
  port: 8080

spring:
  config:
    import: "optional:classpath:application-local.yml,optional:file:./application-local.yml"
  thymeleaf:
    cache: false

app:
  # Presto calls notifyUrl from its servers — set APP_PUBLIC_BASE_URL to a public URL (e.g. ngrok), not localhost.
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  default-currency: MYR

# Merchant credentials come from PRESTOPAY_* env vars or application-local.yml (gitignored); see sample/README.md.
prestopay:
  environment: ${PRESTOPAY_ENV:staging}
  mid: ${PRESTOPAY_MID:}
  mrn: ${PRESTOPAY_MRN:}
  keystore-path: ${PRESTOPAY_KEYSTORE_PATH:classpath:keys/presto_rm_keystore.p12}
  keystore-password: ${PRESTOPAY_KEYSTORE_PASSWORD:}
  keystore-alias: ${PRESTOPAY_KEYSTORE_ALIAS:}
  public-key-path: ${PRESTOPAY_PUBLIC_KEY_PATH:classpath:keys/presto_ext_service_dev.der}

logging:
  level:
    com.prestouniverse.pay.sample: INFO
    com.prestouniverse.pay: WARN
