<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>MyStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-900">
<div class="mx-auto max-w-md px-4 py-8">

  <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
    <header class="flex items-center gap-2 bg-slate-900 px-6 py-4 text-lg font-bold text-white">
      <i class="fa-solid fa-store" aria-hidden="true"></i>
      <span>MyStore</span>
    </header>

    <div class="p-6">
      <div id="checkoutAlert" class="mb-5 hidden rounded-lg border border-red-200 bg-red-50 p-4 text-red-700">
        <strong>Could not start payment</strong>
        <p id="checkoutAlertMessage"></p>
      </div>

      <form id="checkoutForm" th:object="${checkout}">
        <input type="hidden" th:field="*{pageTitle}"/>

        <label class="mb-5 flex cursor-pointer items-center justify-between gap-4 rounded-lg border border-amber-200 bg-amber-50 p-4">
          <span>
            <strong class="block text-sm text-slate-900">Show payment methods on checkout</strong>
            <span class="mt-0.5 block text-xs text-amber-800" id="toggleDesc"
                  th:text="*{showPaymentMethods} ? 'On: shopper selects here, before paying' : 'Off: shopper selects after redirect, on the Presto payment page'">
              Off: shopper selects after redirect, on the Presto payment page
            </span>
          </span>
          <span class="relative inline-flex h-6 w-11 shrink-0 items-center">
            <input type="checkbox" id="showPaymentMethods" th:field="*{showPaymentMethods}" class="peer sr-only"/>
            <span class="absolute inset-0 rounded-full bg-slate-300 transition-colors peer-checked:bg-indigo-600"></span>
            <span class="relative h-5 w-5 translate-x-0.5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5"
                  aria-hidden="true"></span>
          </span>
        </label>

        <h1 class="text-xl font-bold">Checkout</h1>
        <p class="mb-4 text-sm text-slate-500" id="checkoutHint"
           th:text="*{showPaymentMethods} ? 'Enter the amount and description, then choose how you want to pay.' : 'Enter the amount and description. You will choose how to pay on the next page.'">
          Enter the amount and description. You will choose how to pay on the next page.
        </p>

        <div class="mb-4 grid gap-4 sm:grid-cols-2">
          <div>
            <label for="amountInRinggit" class="mb-1 block text-xs font-medium text-slate-500">Amount (MYR)</label>
            <div class="flex items-center overflow-hidden rounded-lg border border-slate-300 focus-within:ring-2 focus-within:ring-indigo-100">
              <span class="border-r border-slate-300 bg-slate-50 px-3 py-2 text-sm text-slate-500">RM</span>
              <input id="amountInRinggit" type="number" step="0.01" min="0.01" th:field="*{amountInRinggit}"
                     class="w-full border-0 px-3 py-2 text-sm focus:outline-none focus:ring-0"/>
            </div>
            <div id="amountInRinggitError" class="mt-1 hidden text-xs text-red-600"></div>
          </div>
          <div>
            <label for="displayDesc" class="mb-1 block text-xs font-medium text-slate-500">Description</label>
            <input id="displayDesc" type="text" th:field="*{displayDesc}" maxlength="200"
                   placeholder="What is this payment for?"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-500"/>
            <div id="displayDescError" class="mt-1 hidden text-xs text-red-600"></div>
          </div>
        </div>

        <div id="methodSection" class="mt-5 border-t border-slate-200 pt-5"
             th:classappend="*{showPaymentMethods} ? '' : ' hidden'">
          <fieldset class="mb-4">
            <legend class="mb-3 text-sm font-semibold">Choose Payment Method</legend>
            <div id="selectedPaymentMethodError" class="mb-2 hidden text-xs text-red-600"></div>

            <div class="mb-3 flex flex-wrap gap-2" id="categoryPills"></div>

            <div class="flex flex-col gap-2.5" id="methodList"></div>
          </fieldset>

          <div class="mb-4 grid gap-4 sm:grid-cols-2">
            <div>
              <label for="receiptName" class="mb-1 block text-xs font-medium text-slate-500">Receipt name (optional)</label>
              <input id="receiptName" type="text" th:field="*{receiptName}" maxlength="200"
                     class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-500"/>
            </div>
            <div>
              <label for="receiptEmail" class="mb-1 block text-xs font-medium text-slate-500">Receipt email (optional)</label>
              <input id="receiptEmail" type="email" th:field="*{receiptEmail}" maxlength="320"
                     class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-500"/>
            </div>
          </div>
        </div>

        <button type="submit" id="submitButton"
                class="mt-2 flex w-full items-center justify-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-indigo-700">
          <i class="fa-solid fa-lock" aria-hidden="true"></i>
          <span id="submitButtonLabel"
                th:text="*{showPaymentMethods} ? 'Pay RM ' + ${#numbers.formatDecimal(checkout.amountInRinggit, 1, 'COMMA', 2, 'POINT')} : 'Continue to Payment'">
            Continue to Payment
          </span>
        </button>
        <p class="mt-3 flex items-center justify-center gap-1.5 text-center text-xs text-slate-500">
          <i class="fa-solid fa-lock" aria-hidden="true"></i>
          <span id="checkoutFootnote"
                th:text="*{showPaymentMethods} ? 'Secure and encrypted. Card details are entered on the Presto secure page next.' : 'Secure and encrypted'">
            Secure and encrypted
          </span>
        </p>
      </form>
    </div>
  </section>

  <section class="mt-6" th:if="${!#lists.isEmpty(recentWebhooks)}">
    <h3 class="mb-3 text-xs font-semibold uppercase tracking-wide text-slate-500">Recent webhooks (shared)</h3>
    <div class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
      <table class="w-full text-xs">
        <thead>
        <tr class="bg-slate-50 text-slate-500">
          <th class="px-3 py-2 text-left font-medium">Time</th>
          <th class="px-3 py-2 text-left font-medium">Event</th>
          <th class="px-3 py-2 text-left font-medium">Status</th>
          <th class="px-3 py-2 text-left font-medium">Txn ref</th>
          <th class="px-3 py-2 text-left font-medium">success</th>
        </tr>
        </thead>
        <tbody>
        <tr class="border-t border-slate-200" th:each="w : ${recentWebhooks}">
          <td class="px-3 py-2" th:text="${#temporals.format(w.receivedAt, 'HH:mm:ss')}">12:00</td>
          <td class="px-3 py-2" th:text="${w.eventCode}">Authorised</td>
          <td class="px-3 py-2" th:text="${w.paymentStatus}">Authorised</td>
          <td class="px-3 py-2" th:text="${w.txnRefNum}">demo-</td>
          <td class="px-3 py-2" th:classappend="${w.eventCode == 'Authorised'} ? ' font-semibold text-green-600' : _"
              th:text="${w.success}">true</td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>

<script th:inline="javascript">
  // Bridge for checkout.js: the server-rendered default form's selected method, so the JS-built
  // method list can mark the right radio as checked on first paint.
  window.CHECKOUT_DEFAULT_SELECTED_METHOD = /*[[${checkout.selectedPaymentMethod}]]*/ 'PmPgCard';
</script>
<script th:src="@{/js/checkout.js}"></script>
</body>
</html>
