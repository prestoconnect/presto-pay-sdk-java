<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Self-hosted checkout</title>
  <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="page-custom">
<div class="wrap">
  <nav class="top-nav">
    <a th:href="@{/}">← All samples</a>
    <span class="nav-tag">Self-hosted payment page</span>
  </nav>

  <div class="alert error" th:if="${paymentError}">
    <strong>Could not start payment</strong>
    <p th:text="${message}">Error</p>
    <p th:if="${errorCode != null}">
      <span th:text="${errorCode}">code</span>:
      <span th:text="${errorMessage}">message</span>
    </p>
  </div>

  <form th:object="${checkout}" th:action="@{/self-hosted}" method="post" class="custom-layout">
    <aside class="custom-preview">
      <p class="preview-eyebrow">Live preview</p>
      <h1 class="preview-title" id="previewTitle" th:text="*{pageTitle}">Acme Store</h1>
      <p class="preview-desc" id="previewDesc" th:text="*{displayDesc}">Order</p>
      <p class="preview-amount">
        <span id="previewAmount" th:text="'MYR ' + *{amountInRinggit}">MYR 10.00</span>
      </p>
      <p class="preview-method">Method: <strong id="previewMethod">—</strong></p>
    </aside>

    <div class="custom-form">
      <h2>Build your checkout</h2>
      <p class="hint">Fields on the left mirror what you configure here. Payment method maps to <code>allowedPaymentMethods</code>.</p>

      <div class="field">
        <label for="pageTitle">Page title (your UI only)</label>
        <input id="pageTitle" type="text" th:field="*{pageTitle}" maxlength="80" data-preview="title"/>
        <div class="err" th:if="${#fields.hasErrors('pageTitle')}" th:errors="*{pageTitle}"></div>
      </div>
      <div class="field">
        <label for="displayDesc">Order description (sent to Presto)</label>
        <input id="displayDesc" type="text" th:field="*{displayDesc}" maxlength="200" data-preview="desc"/>
        <div class="err" th:if="${#fields.hasErrors('displayDesc')}" th:errors="*{displayDesc}"></div>
      </div>
      <div class="field">
        <label for="amountInRinggit">Amount (MYR)</label>
        <input id="amountInRinggit" type="number" step="0.01" min="0.01" th:field="*{amountInRinggit}" data-preview="amount"/>
        <div class="err" th:if="${#fields.hasErrors('amountInRinggit')}" th:errors="*{amountInRinggit}"></div>
      </div>

      <fieldset class="method-fieldset">
        <legend>Payment method</legend>
        <div class="err" th:if="${#fields.hasErrors('selectedPaymentMethod')}" th:errors="*{selectedPaymentMethod}"></div>
        <div class="method-grid">
          <label class="method-tile" th:each="m : ${paymentMethods}">
            <input type="radio" th:field="*{selectedPaymentMethod}" th:value="${m.gatewayCode}"
                   th:attr="data-label=${m.displayName}"/>
            <span class="method-group" th:text="${m.category}">Group</span>
            <span class="method-name" th:text="${m.displayName}">Wallet</span>
          </label>
        </div>
      </fieldset>

      <div class="field-row">
        <div class="field">
          <label for="receiptName">Receipt name (optional)</label>
          <input id="receiptName" type="text" th:field="*{receiptName}" maxlength="200"/>
        </div>
        <div class="field">
          <label for="receiptEmail">Receipt email (optional)</label>
          <input id="receiptEmail" type="email" th:field="*{receiptEmail}" maxlength="320"/>
        </div>
      </div>

      <button type="submit" class="btn btn-custom">Pay with selected method</button>
    </div>
  </form>
</div>
<script th:inline="javascript">
  (function () {
    var title = document.getElementById('pageTitle');
    var desc = document.getElementById('displayDesc');
    var amount = document.getElementById('amountInRinggit');
    var previewTitle = document.getElementById('previewTitle');
    var previewDesc = document.getElementById('previewDesc');
    var previewAmount = document.getElementById('previewAmount');
    var previewMethod = document.getElementById('previewMethod');
    var radios = document.querySelectorAll('input[name="selectedPaymentMethod"]');

    function syncPreview() {
      if (title) previewTitle.textContent = title.value || 'Your store';
      if (desc) previewDesc.textContent = desc.value || 'Order description';
      if (amount) previewAmount.textContent = 'MYR ' + (amount.value || '0.00');
      var label = '—';
      var i;
      for (i = 0; i < radios.length; i++) {
        if (radios[i].checked) label = radios[i].getAttribute('data-label') || radios[i].value;
      }
      if (previewMethod) previewMethod.textContent = label;
    }

    if (title) title.addEventListener('input', syncPreview);
    if (desc) desc.addEventListener('input', syncPreview);
    if (amount) amount.addEventListener('input', syncPreview);
    var r;
    for (r = 0; r < radios.length; r++) {
      radios[r].addEventListener('change', syncPreview);
    }
    syncPreview();
  })();
</script>
</body>
</html>
