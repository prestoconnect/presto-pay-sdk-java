name: Release

# Push a tag like v0.1.0 whose version matches pom.xml. Requires repository secrets:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  - Central Portal user token
#   MAVEN_GPG_PRIVATE_KEY / MAVEN_GPG_PASSPHRASE     - armored signing key and its passphrase
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check tag matches pom version
        run: |
          version=$(./mvnw --batch-mode -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pom version ${version}" >&2
            exit 1
          fi
          case "${version}" in *-SNAPSHOT) echo "Refusing to release a SNAPSHOT" >&2; exit 1;; esac

      - name: Verify, sign, and upload to Maven Central
        run: ./mvnw --batch-mode -Prelease,central deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
