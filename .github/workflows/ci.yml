name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["8", "11", "17", "21"]
    name: JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"
          cache: maven

      # Checkstyle 10 needs Java 11+ to run; the JDK 11+ jobs enforce it.
      - name: Verify (tests only)
        if: matrix.java == '8'
        run: ./mvnw --batch-mode verify -Dcheckstyle.skip

      - name: Verify (tests + Checkstyle)
        if: matrix.java != '8'
        run: ./mvnw --batch-mode verify

      - name: Build sources and Javadoc jars
        if: matrix.java == '17'
        run: ./mvnw --batch-mode verify -Prelease -DskipTests -Dcheckstyle.skip
